wandb:
  entity: "valterschutz-chalmers-university-of-technology"
  project: "medseg-train-attention-ppo-threshold"
ahus_model:
  device: "cuda"
  type: "ahus_model_rope_mixed"
  weights_path: "weights/rope_mixed_120_accum/model_latest.pth"
env:
  device: "cpu"
total_frames: 10000
eval_every_n_batches: 100
eval_max_steps: 10
dataset:
  # size_threshold: 16777216 # 256^3
  # size_threshold: 2097152 # 128^3
  size_threshold: 4194304 # 256*128*128
  base_dir: "data/CVPR-BiomedSegFM/3D_val_combined_single"
agent:
  kwargs:
    _device: "cpu"
    gamma: 0.99
    lmbda: 0.0
    clip_epsilon: 0.2
    entropy_bonus: true
    entropy_coef: 0.1
    critic_coef: 1
    loss_critic_type: "smooth_l1"
    lr: 0.00001
    max_grad_norm: 10
    batch_size: 1
    sub_batch_size: 1
    num_epochs: 10
    replay_buffer_device: "cuda"
    prompt_embedding_dim: 128
    backbone_out_size: 16
  save_path: "weights/attention_ppo_threshold/agent"
