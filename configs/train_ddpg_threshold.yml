wandb:
  entity: "valterschutz-chalmers-university-of-technology"
  project: "medseg-train-ddpg-threshold"
ahus_model:
  type: "ahus_model_rope_mixed"
  weights_path: "$WEIGHTS_DIR/rope_mixed/latest.pth"

device: "cpu"
total_frames: 1000
eval_every_n_batches: 100
eval_max_steps: 10
dataset:
  size_threshold: 2097152 # 128^3
  base_dir: "$DATA_DIR/3D_val_combined_small"
agent:
  type: "DDPG"
  kwargs:
    lr: 0.001
    update_tau: 0.005
    replay_buffer_size: 50 # Many Gb...
    replay_buffer_device: "cpu"
    num_optim: 10
    max_grad_norm: 100
  save_path: "$WEIGHTS_DIR/rl/ddpg_threshold.pth"
